const detailDialogBody=document.getElementById('detailDialogBody');
let lastDetailTrigger=null;
function showDetail(task,trigger){
  lastDetailTrigger=trigger;
  detailDialogTitle.textContent=task.subject+' · '+task.title;
  detailDialogSub.textContent='2026학년도 · '+currentSchool+' · 1학년 · 학기말 반영점수 '+task.maxpoint+'점 (100점 환산 기준)';
  detailDialogBody.replaceChildren(buildDetail(task));
  detailDialogBody.scrollTop=0;
  document.body.classList.add('modal-open');
  detailDialog.showModal();
  document.getElementById('detailDialogClose').focus();
}
document.getElementById('detailDialogClose').addEventListener('click',()=>detailDialog.close());
detailDialog.addEventListener('click',event=>{if(event.target===detailDialog)detailDialog.close()});
detailDialog.addEventListener('close',()=>{
  document.body.classList.remove('modal-open');
  if(lastDetailTrigger && lastDetailTrigger.isConnected)lastDetailTrigger.focus();
  lastDetailTrigger=null;
});
const el=(tag,cls,text)=>{const n=document.createElement(tag);if(cls)n.className=cls;if(text!==undefined)n.textContent=text;return n};
function tableWrap(t){const d=el('div','table-wrap');d.append(t);return d}
function td(text){return el('td','',text)}
function th(text,scope){const n=el('th','',text);if(scope)n.scope=scope;return n}
function buildHeader(names,classes=''){const t=el('table','detail-table '+classes),h=el('thead'),r=el('tr');names.forEach(name=>r.append(th(name,'col')));h.append(r);t.append(h);return t}
function buildMeta(task){
  const t=el('table','detail-table meta-table');const b=el('tbody');
  const lines=[];if(task.standards.length)lines.push(['성취기준',task.standards.join('\n')]);if(task.idea.length)lines.push(['핵심 아이디어',task.idea.join('\n')]);
  if(task.ai!==null)lines.push(['AI 활용 여부',task.ai==='O'?'활용':'활용 안 함']);
  lines.forEach(([name,value])=>{let r=el('tr');r.append(th(name,'row'),td(value));b.append(r)});
  if(!task.methods.length){t.append(b);return lines.length?tableWrap(t):null;}
  const r=el('tr');r.append(th('평가 방법','row'));const c=el('td'),chips=el('div','method-list');
  task.methods.forEach(method=>{
    const checked=method.startsWith('■')||method.startsWith('☑');
    const name=method.replace(/^[■☑□]\s*/, '').trim();
    // The source HWP includes some unmarked entries; show exact provided labels.
    if(name){const chip=el('span','method-chip'+(checked?' checked':''),(checked?'✓ ':'')+name);chips.append(chip)}
  });c.append(chips);r.append(c);b.append(r);t.append(b);return tableWrap(t)
}
function buildRubric(task){const t=buildHeader(['수준','평가 기준'],'grade-table'),body=el('tbody');for(const k of ['A','B','C','D','E']){const r=el('tr');r.append(td(k),td(task.rubric[k]||'—'));body.append(r)}t.append(body);return tableWrap(t)}
function buildScores(task){const t=buildHeader(['채점 요소','채점 기준','배점'],'scoring-table');const body=el('tbody');
  for(let i=0;i<task.scoring.length;i++){
    const x=task.scoring[i],r=el('tr');
    if(i===0||task.scoring[i-1].element!==x.element){const n=task.scoring.slice(i).findIndex(q=>q.element!==x.element);const span=n===-1?task.scoring.length-i:n;const c=el('th','',x.element);c.scope='row';c.rowSpan=span;r.append(c)}
    r.append(td(x.criterion),td(x.score));body.append(r);
  }
  t.append(body);return tableWrap(t)
}
function buildDetail(task){
  const div=el('div','detail-panel');div.id='detail-'+task.id;div.append(el('h5','',task.title+' · 수행평가 세부 기준'));
  if(task.detailNotice){div.append(el('p','missing-detail',task.detailNotice));return div;}
  const meta=buildMeta(task);if(meta)div.append(meta);if(Object.values(task.rubric||{}).some(v=>v)){div.append(el('h6','detail-section-title',task.rubricExample?'평가 기준 (예시)':'평가 기준'));div.append(buildRubric(task));}
  if(task.scoreNotice){div.append(el('p','missing-detail',task.scoreNotice));}else{div.append(el('h6','detail-section-title','채점 요소 · 채점 기준 · 배점'));div.append(buildScores(task));}return div;
}
function buildTask(task){
  const item=el('article','task-item');
  const head=el('div','task-title');
  head.append(el('h4','',task.title),el('span','weight-badge',task.maxpoint+'점'));
  item.append(head);
  const body=el('div','task-body');
  body.append(el('p','task-description',task.task));
  const foot=el('div','task-bottom');
  const b=el('button','detail-toggle');
  b.type='button';
  b.setAttribute('aria-haspopup','dialog');
  b.append(document.createTextNode('세부항목 확인'));
  b.append(el('span','chevron','↗'));
  b.addEventListener('click',()=>showDetail(task,b));
  foot.append(b);body.append(foot);item.append(body);
  return item;
}
function renderResults(){
  result.replaceChildren();
  const title=el('div','panel-head result-heading');title.append(el('span','round-check','✓'),el('h2','',currentSchool+' · 1학년 수행평가'),el('span','result-subtitle','2026학년도 · 수학·과학'));result.append(title);
  if(!['대건고','송도고','신송고','연송고','해송고','박문여고','인천여고'].includes(currentSchool)){
    const empty=el('div','empty-school');empty.append(el('h3','',currentSchool+' 수행평가 자료 준비 중'),el('p','', '현재는 대건고·송도고·신송고·연송고·해송고·박문여고·인천여고 2026학년도 1학년 수학·과학 자료만 등록되어 있습니다.'));result.append(empty);return;
  }
  const grid=el('div','subject-grid');
  for(const course of courseOrder){
    const list=tasks.filter(t=>t.school===currentSchool && t.subject===course), card=el('section','subject-card');
    card.classList.add({'공통수학1':'course-math1','공통수학2':'course-math2','통합과학1':'course-science1','통합과학2':'course-science2'}[course]);
    const total=list.reduce((sum,t)=>sum+t.maxpoint,0);
    const head=el('div','subject-header');
    head.append(el('h3','',course),el('span','subject-meta','지필 '+(100-total)+', 수행 '+total));
    card.append(head);
    const items=el('div','subject-tasks');
    for(const t of list)items.append(buildTask(t));
    card.append(items);
    grid.append(card);
  }
  result.append(grid);
}
schoolButtons.forEach(b=>b.addEventListener('click',()=>{const name=b.dataset.school;if(currentSchool===name)return;currentSchool=name;schoolButtons.forEach(x=>x.setAttribute('aria-pressed',String(x===b)));renderResults()}));
renderResults();
</script>
</body></html>
