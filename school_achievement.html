button{font:inherit;cursor:pointer}

.container{width:min(1320px,calc(100% - 2*clamp(12px,4vw,36px)));margin:auto}
/* 다른 입시 안내 페이지와 동일한 제목·설명·하단 가로선 구성 */
.hero{position:relative;isolation:isolate;overflow:hidden;margin-top:16px;padding:24px 28px 29px;

.hero h1,.hero p{position:relative;z-index:1}
.hero h1{font-size:clamp(28px,3.6vw,42px);line-height:1.08;margin:0;font-weight:900;letter-spacing:-.06em}
.hero p{margin:9px 0 0;max-width:900px;color:rgba(255,255,255,.9);font-size:clamp(13px,1.35vw,15.5px);
  line-height:1.5;font-weight:700;letter-spacing:-.025em}
.global-menu-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,112px),1fr));gap:8px;margin:13px 0 16px;padding:14px;background:#fff;border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow)}
.global-menu-button{display:flex;align-items:center;justify-content:center;min-width:0;min-height:45px;padding:9px 7px;border:1px solid var(--line);border-radius:13px;background:#f4f7fd;color:#233657;text-align:center;text-decoration:none;font-size:clamp(12px,1vw,14px);font-weight:800;line-height:1.25}
.global-menu-button:hover{background:#e7eefc}.global-menu-button.active{color:#fff;background:var(--navy);border-color:var(--navy)}
.card{padding:18px 20px;margin:14px 0;background:#fff;border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow)}
.topline{display:flex;align-items:center;justify-content:space-between;gap:14px;margin:0 0 14px}
.topline h2{margin:0;font-size:20px;font-weight:950;letter-spacing:-.045em}
.school-picker{padding:12px 14px;margin:11px 0}.school-picker .topline{margin-bottom:8px}
.school-grid{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:5px}
.school-tab{min-width:0;min-height:35px;padding:5px 3px;border:1px solid #d9e2f0;border-radius:9px;background:#f3f6fc;color:#2c3d59;font-size:13.5px;font-weight:850;line-height:1.15;white-space:normal}
.school-tab:hover{background:#e5edfb}.school-tab[aria-selected=true]{background:var(--navy);border-color:var(--navy);color:#fff}.school-tab.compare-tab{font-size:12px}

.year-tab[aria-pressed=true]{color:white;border-color:var(--navy);background:var(--navy)}
.compare-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;align-items:start}
.compare-panel{min-width:0;overflow:hidden;border:1px solid var(--line);border-radius:15px;background:#fff}

.compare-table th,.compare-table td{border-bottom:1px solid #e5ebf5;text-align:center;line-height:1.3}

.compare-table td{padding:11px 2px;color:#253953;font-weight:650;font-size:13.5px}
.compare-table td:first-child{font-weight:800;overflow-wrap:anywhere}

/* 주요과목 비교: 과목(행) × 학교별 평균/A비율(열), 남고·여고 통합표 */
.matrix-wrap{max-width:100%;overflow-x:auto;overflow-y:hidden;border:1px solid var(--line);border-radius:14px;background:#fff;-webkit-overflow-scrolling:touch}
.matrix-table{width:100%;min-width:1040px;border-collapse:separate;border-spacing:0;table-layout:fixed;font-variant-numeric:tabular-nums}
.matrix-table col.subject-col{width:138px}
.matrix-table col.value-col{width:calc((100% - 138px)/14)}
.matrix-table th,.matrix-table td{border-right:1px solid #e3eaf5;border-bottom:1px solid #e3eaf5;text-align:center;vertical-align:middle;white-space:nowrap}
.matrix-table tr>*:last-child{border-right:0}
.matrix-table tbody tr:last-child>*{border-bottom:0}
.matrix-table thead th{font-weight:900;color:#203a61}
.matrix-table .group-row th{height:39px;padding:8px 4px;font-size:15px;background:#e5eefe}
.matrix-table .group-row .boys-head{background:#dbe7fa}

.matrix-table .group-row .subject-head{background:#e7eef9;text-align:left;padding-left:14px;font-size:14px}
.matrix-table .school-row th{height:37px;padding:6px 2px;font-size:13px;background:#f2f6fe}
.matrix-table .school-row .girls-school{background:#faf5ff}
.matrix-table .metric-row th{height:32px;padding:5px 1px;font-size:11.5px;background:#f9fbfe;color:#536987}
.matrix-table .metric-row .girls-metric{background:#fdfaff}
.matrix-table tbody th{padding:12px 6px 12px 13px;text-align:left;font-size:14px;font-weight:850;line-height:1.3;background:#fff;color:#253c5c}
.matrix-table tbody td{padding:10px 2px;font-size:14px;font-weight:760;color:#26405f}
.matrix-table tbody td.avg-cell{color:#163f77;font-weight:900}
.matrix-table tbody td.a-cell{color:#606e87}

.matrix-table tbody tr:hover td,.matrix-table tbody tr:hover th{background:#eaf2ff}
.matrix-table .girls-divider{border-left:2px solid #b5a5d4!important}

.matrix-table .missing-cell{color:#a5afbd;font-weight:500}

.school-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:5px}.school-tab{font-size:14px;min-height:36px;padding:5px 4px}.school-tab.compare-tab{font-size:12.5px}.school-picker{padding:10px}.school-picker .topline{margin-bottom:7px}

}
@media(max-width:350px){.mini-dist span{font-size:12px}.mini-name{font-size:14px}}

.global-menu-grid {

</style>

}
function filteredRows(period,grade){return DATA[state.school]?.[period]?.[grade]||[];}
function renderTable(rows){
 if(!rows.length)return '<div class="empty">–</div>';
 const headers='<thead><tr><th scope="col">과목</th><th scope="col">평균</th>'+[...'ABCDE'].map(c=>`<th scope="col">${c}</th>`).join('')+'</tr></thead>';
 const body=rows.map(r=>`<tr${r.check?' class="suspect" title="원본 수치 확인 필요"':''}><td>${courseName(r.subject)}</td><td>${esc(fmt(r.avg))}</td>${r.dist.map(v=>`<td>${esc(fmt(v))}</td>`).join('')}</tr>`).join('');
 return `<table class="compare-table">${headers}<tbody>${body}</tbody></table>`;
}
function renderMobile(rows){
 if(!rows.length)return '<div class="empty">–</div>';
 return '<div class="mobile-rows">'+rows.map(r=>`<article class="mini-subject"${r.check?' title="원본 수치 확인 필요"':''}><div class="mini-top"><span class="mini-name">${courseName(r.subject)}</span><strong class="mini-avg">${esc(fmt(r.avg))}</strong></div><div class="mini-dist">${r.dist.map((v,i)=>`<div><b>${'ABCDE'[i]}</b><span>${esc(fmt(v))}</span></div>`).join('')}</div></article>`).join('')+'</div>';
}
/* 학교에서 공개한 2026학년도 1학기말 최종 성취수준 추정분할점수(종합) */
const HAESONG_CUTOFF_2026={
 subjects:['공통국어1','공통수학1','공통영어1','한국사1','통합사회1','통합과학1','정보'],
 rows:[
  ['A/B',[77,69,73,79,76,81,81]],
  ['B/C',[62,54,61,64,59,64,66]],
  ['C/D',[46,40,49,49,43,47,50]],
  ['D/E',[31,25,36,34,26,30,34]],
  ['E/미도달',[17,12,20,15,14,16,null]]
 ]
};
function renderHaesongCutoff(){
 const heads=HAESONG_CUTOFF_2026.subjects.map(name=>`<th scope="col">${esc(name)}</th>`).join('');
 const rows=HAESONG_CUTOFF_2026.rows.map(([level,values])=>
  `<tr><th scope="row">${esc(level)}</th>${values.map(value=>`<td>${esc(fmt(value))}</td>`).join('')}</tr>`
 ).join('');
 return `<section class="compare-panel" aria-label="해송고 2026학년도 1학년 성취수준 추정분할점수">`+
  `<h3 class="compare-heading cutoff-heading">성취수준 추정분할점수</h3>`+
  `<div class="cutoff-scroll" role="region" aria-label="성취수준 추정분할점수 표" tabindex="0">`+
  `<table class="cutoff-table"><thead><tr><th scope="col">과목</th>${heads}</tr></thead><tbody>${rows}</tbody></table>`+
  `</div></section>`;
}
function panel(title,rows,extra){
 return `<section class="compare-panel" aria-label="${esc(title)}"><h3 class="compare-heading">${esc(title)}</h3>${renderTable(rows)}${renderMobile(rows)}${extra||''}</section>`;
}
function getMajorRow(school,subject){
 const grade=subjects.indexOf(subject)<5?'1학년':'2학년';
 return (DATA[school]?.['2026-1']?.[grade]||[]).find(r=>subjectParts(r.subject).name===subject)||null;
}
function renderSubjectCompare(){
 // 성별 그룹은 기존 화면에 사용되던 학교 구성과 순서를 유지한다.
 const allSchools=[...maleSchools,...femaleSchools];
 const genderHeader=`<tr class="group-row"><th scope="col" rowspan="3" class="subject-head">과목</th>`+
   `<th scope="colgroup" colspan="${maleSchools.length*2}" class="boys-head">남고</th>`+
   `<th scope="colgroup" colspan="${femaleSchools.length*2}" class="girls-head girls-divider">여고</th></tr>`;
 const schoolHeader='<tr class="school-row">'+allSchools.map((name,i)=>
   `<th scope="colgroup" colspan="2" class="${i>=maleSchools.length?'girls-school':''} ${i===maleSchools.length?'girls-divider':''}">${esc(name)}</th>`
 ).join('')+'</tr>';
 const metricHeader='<tr class="metric-row">'+allSchools.map((name,i)=>{
   const girl=i>=maleSchools.length;
   const cls=girl?'girls-metric':'';
   return `<th scope="col" class="${cls} ${i===maleSchools.length?'girls-divider':''}" aria-label="${esc(name)} 평균">평균</th>`+
      `<th scope="col" class="${cls}" aria-label="${esc(name)} A비율">A비율</th>`;
 }).join('')+'</tr>';
 const rows=subjects.map((subject,index)=>{
   const cells=allSchools.map((name,i)=>{
     const r=getMajorRow(name,subject);
     const divider=i===maleSchools.length?' girls-divider':'';
     if(!r)return `<td class="missing-cell${divider}">–</td><td class="missing-cell">–</td>`;
     return `<td class="avg-cell${divider}">${esc(fmt(r.avg))}</td>`+
       `<td class="a-cell">${r.dist?.[0]==null?'–':esc(fmt(r.dist[0]))+'%'}</td>`;
   }).join('');
   return `<tr><th scope="row">${esc(subject)}</th>${cells}</tr>`;
 }).join('');
 $('genderComparison').innerHTML='<div class="matrix-wrap" role="region" aria-label="주요과목 학교별 평균 및 A비율 비교" tabindex="0">'+
   '<table class="matrix-table"><colgroup><col class="subject-col">'+
   allSchools.map(()=>'<col class="value-col"><col class="value-col">').join('')+
   '</colgroup><thead>'+genderHeader+schoolHeader+metricHeader+'</thead><tbody>'+rows+'</tbody></table></div>';
}
function render(){
 const high=state.type==='high';
 const comparison=state.school===COMPARE_KEY;
 $('schoolTabs').innerHTML=[...schoolList,COMPARE_KEY].map((name,i)=>{
   const active=high && name===state.school;
   return `<button type="button" class="school-tab${name===COMPARE_KEY?' compare-tab':''}" role="tab" id="tab-high-${i}" data-school="${esc(name)}" aria-selected="${active}" tabindex="${active?'0':'-1'}">${name===COMPARE_KEY?'고등학교별 A비율':esc(name)}</button>`;
 }).join('');
 $('middleSchoolTabs').innerHTML=[...middleSchoolList,MIDDLE_COMPARE_KEY].map((name,i)=>{
   const active=!high && name===state.school;
   return `<button type="button" class="middle-school-button${name===MIDDLE_COMPARE_KEY?' compare-tab':''}" role="tab" id="tab-middle-${i}" data-middle-school="${esc(name)}" aria-selected="${active}" tabindex="${active?'0':'-1'}">${name===MIDDLE_COMPARE_KEY?'중학교별 A비율':esc(name)}</button>`;
 }).join('');
 $('schoolDetail').hidden=!high || comparison;
 $('subjectComparison').hidden=!high || !comparison;
 $('middleSchoolSection').hidden=high;
 if(!high){if(window.middleSchoolRenderer)window.middleSchoolRenderer();return;}
 if(comparison){renderSubjectCompare();return;}
 $('selectedSchool').textContent=state.school;
 document.querySelectorAll('[data-year]').forEach(button=>button.setAttribute('aria-pressed',String(button.dataset.year===state.year)));
 let a,b;
 if(state.year==='2026'){
  a=panel('1학년 · 1학기',filteredRows('2026-1','1학년'));
  if(state.school==='해송고')a=`<div class="compare-stack">${a}${renderHaesongCutoff()}</div>`;
  b=panel('2학년 · 1학기',filteredRows('2026-1','2학년'));
 }else{
  const additional=filteredRows('2025-2','2학년');
  const appendix=additional.length?`<h4 class="subheading">2학년</h4>${renderTable(additional)}${renderMobile(additional)}`:'';
  a=panel('1학년 · 1학기',filteredRows('2025-1','1학년'));
  b=panel('1학년 · 2학기',filteredRows('2025-2','1학년'),appendix);
 }
 $('compareGrid').innerHTML=a+b;
 // 폰트 로딩이나 화면 크기가 바뀌어도 해송고 좌우 표의 맨 아래 테두리를 일치시킨다.
 requestAnimationFrame(alignHaesongBottom);
}
function alignHaesongBottom(){
 const grid=$('compareGrid');
 const scroll=grid.querySelector('.compare-stack .cutoff-scroll');
 if(!scroll)return;
 scroll.style.height='';
 if(window.matchMedia('(max-width:1020px)').matches)return;
 const right=grid.querySelector(':scope > .compare-panel');
 if(!right)return;
 // 표와 바깥쪽 테두리 1px을 고려해 좌·우 카드의 하단선을 정확히 맞춘다.
 const targetHeight=right.getBoundingClientRect().bottom-scroll.getBoundingClientRect().top-1;
 if(targetHeight>0)scroll.style.height=`${targetHeight.toFixed(3)}px`;
}
window.addEventListener('resize',()=>requestAnimationFrame(alignHaesongBottom));
if(document.fonts)document.fonts.ready.then(()=>requestAnimationFrame(alignHaesongBottom));
$('schoolTabs').addEventListener('click',e=>{
 const b=e.target.closest('[data-school]');if(!b)return;
 state.type='high';state.school=b.dataset.school;render();
});
$('middleSchoolTabs').addEventListener('click',e=>{
 const b=e.target.closest('[data-middle-school]');if(!b)return;
 state.type='middle';state.school=b.dataset.middleSchool;render();
});
function handleSchoolArrows(event,container,names,type,attribute){
 if(!['ArrowLeft','ArrowRight','Home','End'].includes(event.key))return;
 event.preventDefault();
 const selected=state.type===type?state.school:container.querySelector('[aria-selected="true"]')?.getAttribute(attribute);
 const i=Math.max(0,names.indexOf(selected));
 const j=event.key==='Home'?0:event.key==='End'?names.length-1:(i+(event.key==='ArrowRight'?1:-1)+names.length)%names.length;
 state.type=type;state.school=names[j];render();
 container.querySelector('[aria-selected="true"]')?.focus();
}
$('schoolTabs').addEventListener('keydown',event=>handleSchoolArrows(event,$('schoolTabs'),[...schoolList,COMPARE_KEY],'high','data-school'));
$('middleSchoolTabs').addEventListener('keydown',event=>handleSchoolArrows(event,$('middleSchoolTabs'),[...middleSchoolList,MIDDLE_COMPARE_KEY],'middle','data-middle-school'));
$('yearTabs').addEventListener('click',e=>{
 const b=e.target.closest('[data-year]');if(!b)return;state.year=b.dataset.year;render();
});
render();
</script>

<script id="middleAcademicBehavior">
'use strict';
(() => {
  const schoolData = JSON.parse(document.getElementById('middleAcademicData').textContent);
  const schoolNames = ['능허대중','해송중','예송중','신정중','신송중','박문중','은송중','현송중'];
  const comparisonKey = '__middle_comparison__';
  const terms = [
    {key:'2025-1',title:'2025년 1학기'},
    {key:'2025-2',title:'2025년 2학기'},
    {key:'2026-1',title:'2026년 1학기'}
  ];
  const gradeNames = ['1학년','2학년','3학년'];
  const options = {term:'2026-1'};
  const termButtons = document.getElementById('middleTermTabs');
  const view = document.getElementById('middleComparisonContent');
  const safe = value => String(value).replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
  const display = value => value === null || value === undefined || value === '' ? '–' : safe(value);
  const getRows = (school,term,grade) => schoolData[school]?.[term]?.[grade] || [];

  function renderSchool(school) {
    const header = '<thead><tr>' +
      '<th class="middle-grade-head" rowspan="2" scope="col">학년</th>' +
      '<th class="middle-subject-head" rowspan="2" scope="col">과목</th>' +
      terms.map(term => `<th class="middle-term-heading" scope="colgroup" colspan="6">${term.title}</th>`).join('') +
      '</tr><tr>' + terms.map((term,t) => ['평균','A','B','C','D','E'].map((metric,i) =>
        `<th scope="col"${t && i === 0 ? ' class="middle-group-first"' : ''} aria-label="${term.title} ${metric}${i ? ' 비율' : ''}">${metric}</th>`).join('')).join('') + '</tr></thead>';

    const body = gradeNames.map((grade,gradeIndex) => {
      const grouped = terms.map(term => getRows(school,term.key,grade));
      const subjects = [...new Set(grouped.flatMap(rows => rows.map(row => row.subject)))];
      const lookup = grouped.map(rows => new Map(rows.map(row => [row.subject,row])));
      if (!subjects.length) {
        return `<tr class="${gradeIndex ? 'middle-grade-start' : ''}"><th class="middle-grade-cell" scope="rowgroup">${grade}</th>` +
          '<td class="middle-no-data" colspan="19">공개 자료 없음</td></tr>';
      }
      return subjects.map((subject,index) => {
        const first = index === 0;
        const rowClass = first && gradeIndex ? ' class="middle-grade-start"' : '';
        const gradeCell = first ? `<th class="middle-grade-cell" scope="rowgroup" rowspan="${subjects.length}">${grade}</th>` : '';
        const cells = lookup.map((rows,t) => {
          const r = rows.get(subject);
          const values = r ? [r.avg,...r.dist] : [null,null,null,null,null,null];
          return values.map((value,i) => `<td class="${i === 0 ? 'middle-average ' : ''}${t && i === 0 ? 'middle-group-first ' : ''}${value === null || value === undefined ? 'middle-empty' : ''}">${display(value)}</td>`).join('');
        }).join('');
        return `<tr${rowClass}>${gradeCell}<th class="middle-subject-cell" scope="row">${safe(subject)}</th>${cells}</tr>`;
      }).join('');
    }).join('');

    view.innerHTML = `<div class="middle-table-wrap" role="region" aria-label="${safe(school)} 1~3학년 세 학기 학업성취도 비교" tabindex="0">` +
      `<table class="middle-table"><colgroup><col class="middle-grade-column"><col class="middle-subject-column"></colgroup>${header}<tbody>${body}</tbody></table></div>`;
  }

  function renderSchoolComparison() {
    const period = terms.find(term => term.key === options.term);
    const header = '<thead><tr class="group-row">' +
      '<th class="middle-grade-head" rowspan="2" scope="col">학년</th>' +
      '<th class="subject-head middle-subject-head" rowspan="2" scope="col">과목</th>' +
      schoolNames.map(name => `<th scope="colgroup" colspan="2">${safe(name)}</th>`).join('') +
      '</tr><tr class="metric-row">' + schoolNames.map(name =>
        `<th scope="col" aria-label="${safe(name)} 평균">평균</th><th scope="col" aria-label="${safe(name)} A비율">A비율</th>`).join('') + '</tr></thead>';

    // 첫 번째로 실제 표시되는 학년에는 구분선을 넣지 않습니다.
    // 1학년이 없는 학기(2025년 1학기·2026년 1학기)에서도
    // 머리글 바로 아래 두꺼운 가로선이 생기지 않게 합니다.
    let hasRenderedGrade = false;
    const body = gradeNames.map((grade,gradeIndex) => {
      const groups = schoolNames.map(school => getRows(school,options.term,grade));
      const lookup = groups.map(rows => new Map(rows.map(row => [row.subject,row])));
      // 해당 학년·학기의 8개 학교 모두에 있는 과목만 비교합니다.
      const subjects = groups.every(rows => rows.length)
        ? groups[0].map(row => row.subject).filter(subject => lookup.every(school => school.has(subject)))
        : [];
      if (!subjects.length) {
        // 시험이 없는 1학년 1학기는 표시하지 않습니다.
        if (grade === '1학년' && options.term.endsWith('-1')) return '';
        const sectionClass = hasRenderedGrade ? ' class="middle-grade-start"' : '';
        hasRenderedGrade = true;
        return `<tr${sectionClass}><th class="middle-grade-cell" scope="rowgroup">${grade}</th>` +
          '<td class="middle-no-data" colspan="17">공개 자료 없음</td></tr>';
      }
      const sectionClass = hasRenderedGrade ? ' class="middle-grade-start"' : '';
      hasRenderedGrade = true;
      return subjects.map((subject,index) => {
        const first = index === 0;
        const rowClass = first ? sectionClass : '';
        const gradeCell = first ? `<th class="middle-grade-cell" scope="rowgroup" rowspan="${subjects.length}">${grade}</th>` : '';
        const cells = lookup.map(group => {
          const row = group.get(subject);
          if (!row) return '<td class="missing-cell">–</td><td class="missing-cell">–</td>';
          return `<td class="avg-cell">${display(row.avg)}</td><td class="a-cell">${row.dist?.[0] == null ? '–' : display(row.dist[0]) + '%'}</td>`;
        }).join('');
        return `<tr${rowClass}>${gradeCell}<th class="middle-subject-cell" scope="row">${safe(subject)}</th>${cells}</tr>`;
      }).join('');
    }).join('');

    view.innerHTML = `<div class="matrix-wrap" role="region" aria-label="${period.title} 중학교 1~3학년 과목 평균 및 A비율 비교" tabindex="0">` +
      `<table class="matrix-table middle-matrix-table"><colgroup><col class="grade-col"><col class="subject-col">` +
      schoolNames.map(() => '<col class="value-col"><col class="value-col">').join('') +
      `</colgroup>${header}<tbody>${body}</tbody></table></div>`;
  }

  function render() {
    const current = window.schoolPageState;
    if (current.type !== 'middle') return;
    const isCompare = current.school === comparisonKey;
    document.getElementById('middleSelectedSchool').textContent = isCompare ? '중학교별 A비율' : current.school;
    termButtons.hidden = !isCompare;
    termButtons.querySelectorAll('[data-middle-term]').forEach(button => button.setAttribute('aria-pressed', String(button.dataset.middleTerm === options.term)));
    if (isCompare) renderSchoolComparison();
    else renderSchool(current.school);
  }

  termButtons.addEventListener('click',event => {
    const button = event.target.closest('[data-middle-term]');
    if (!button) return;
    options.term = button.dataset.middleTerm;
    render();
  });
  window.middleSchoolRenderer = render;
})();
</script>

<script id="schoolTableStickyHeadBehavior">
'use strict';
(() => {
  // overflow-x:auto 컨테이너 내부의 CSS sticky는 페이지 스크롤을 따라가지
  // 않으므로, 표 머리글만 복제한 고정 영역을 사용합니다.
  const selectors = '.compare-table, .matrix-table, .middle-table, .cutoff-table';
  const pinned = new Map();
  let scheduled = false;

  function remove(table) {
    const record = pinned.get(table);
    if (record) record.viewport.remove();
    pinned.delete(table);
  }

  function create(table) {
    const sourceHead = table.tHead;
    if (!sourceHead) return null;
    const viewport = document.createElement('div');
    viewport.className = 'school-sticky-head-viewport';
    viewport.setAttribute('aria-hidden', 'true'); // 원본 머리글만 스크린리더가 읽습니다.
    const copy = table.cloneNode(false);
    copy.removeAttribute('id');
    const cols = table.querySelector(':scope > colgroup');
    if (cols) copy.append(cols.cloneNode(true));
    copy.append(sourceHead.cloneNode(true));
    viewport.append(copy);
    document.body.append(viewport);
    const record = {viewport, copy, sourceHead};
    pinned.set(table, record);
    return record;
  }

  function update() {
    scheduled = false;
    const tables = [...document.querySelectorAll(selectors)]
      .filter(table => table.tHead && table.getClientRects().length && getComputedStyle(table).display !== 'none');
    const current = new Set(tables);
    for (const table of pinned.keys()) if (!current.has(table) || !table.isConnected) remove(table);

    for (const table of tables) {
      const host = table.closest('.middle-table-wrap, .matrix-wrap, .cutoff-scroll, .compare-panel') || table.parentElement;
      const bounds = table.getBoundingClientRect();
      const header = table.tHead.getBoundingClientRect();
      const area = host.getBoundingClientRect();
      const left = Math.max(0, area.left);
      const right = Math.min(window.innerWidth, area.right);
      const visible = header.top < -1 && bounds.bottom > header.height + 1 &&
        right > left && area.bottom > header.height && header.height > 0;
      let record = pinned.get(table);
      if (!visible) {
        if (record) record.viewport.style.display = 'none';
        continue;
      }
      if (!record || record.sourceHead !== table.tHead) {
        if (record) remove(table);
        record = create(table);
      }
      if (!record) continue;
      const {viewport, copy} = record;
      viewport.style.display = 'block';
      viewport.style.left = `${left}px`;
      viewport.style.width = `${right - left}px`;
      viewport.style.height = `${header.height}px`;
      copy.style.width = `${bounds.width}px`;
      copy.style.minWidth = `${bounds.width}px`;
      // 원본과 고정 영역의 좌우 스크롤 좌표를 동일하게 유지합니다.
      viewport.scrollLeft = host.scrollLeft || 0;
    }
  }

  function schedule() {
    if (!scheduled) {
      scheduled = true;
      requestAnimationFrame(update);
    }
  }
  document.addEventListener('scroll', schedule, {capture:true, passive:true});
  window.addEventListener('resize', schedule, {passive:true});
  const main = document.querySelector('main');
  if (main) new MutationObserver(schedule).observe(main, {childList:true, subtree:true});
  if (document.fonts) document.fonts.ready.then(schedule);
  schedule();
})();
</script>
</body>
</html>
